<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef5f4;--card:#fff;--ink:#0b2530;--mute:#5b7480;--line:#cfe0de;--head:#0b2530;--liquid:#2dd4bf;--live:#0f9d58;--soon:#d99a1c;--done:#8a9ba3;--bad:#d64545}
@media(prefers-color-scheme:dark){:root{--bg:#081a22;--card:#0f2833;--ink:#e6f2f1;--mute:#8fb0b8;--line:#1e4150;--head:#05121a}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--head);color:#e6f2f1;padding:calc(20px + env(safe-area-inset-top)) 20px 18px;background-image:radial-gradient(circle at 92% 20%,rgba(45,212,191,.25),transparent 40%)}
h1{font:800 26px/1.15 "Bricolage Grotesque",sans-serif;margin:0 0 4px}
.sub{color:#9fc3c8;font-size:14px}
main{max-width:720px;margin:0 auto;padding:16px}
.notice{background:#fff4d6;color:#5a4300;border-left:5px solid var(--soon);padding:12px 14px;border-radius:8px;margin-bottom:14px}
.notice:empty{display:none}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
.days button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:500 14px "IBM Plex Sans",sans-serif;cursor:pointer}
.days button[aria-pressed=true]{background:var(--head);color:#fff;border-color:var(--head)}
.days button:focus-visible{outline:3px solid var(--liquid);outline-offset:2px}
.card{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;position:relative;overflow:hidden}
.tile{flex:0 0 72px;height:84px;border:2px solid var(--ink);border-radius:6px;display:flex;flex-direction:column;justify-content:space-between;padding:5px 7px;position:relative;overflow:hidden;background:var(--card)}
.tile .fill{position:absolute;left:0;right:0;bottom:0;background:var(--liquid);opacity:.55;transition:height 1s}
.tile .n,.tile .s{position:relative}
.tile .n{font-size:11px;color:var(--mute)}
.tile .s{font:800 30px/1 "Bricolage Grotesque",sans-serif;text-align:center}
.info{min-width:0;flex:1}
.info h2{font:600 18px/1.25 "Bricolage Grotesque",sans-serif;margin:0 0 2px}
.meta{color:var(--mute);font-size:14px}
.time{font-weight:500;margin-top:4px}
.badge{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:500;color:#fff}
.b-live{background:var(--live)}.b-soon{background:var(--soon)}.b-done{background:var(--done)}.b-cancelled,.b-moved{background:var(--bad)}
.b-live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:6px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.b-live::before{animation:none}.tile .fill{transition:none}}
.cancelled .info h2{text-decoration:line-through}
.empty,.err{text-align:center;color:var(--mute);padding:30px 10px}
footer{text-align:center;color:var(--mute);font-size:13px;padding:10px 16px 28px}
</style>
</head>
<body>
<header>
  <h1 id="title">Class Schedule</h1>
  <div class="sub" id="clock"></div>
</header>
<main>
  <div class="notice" id="notice"></div>
  <div class="days" id="days" role="group" aria-label="Choose day"></div>
  <div id="list"></div>
</main>
<footer id="foot">Checking for updates…</footer>

<script>
var DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var data=null, picked=DAYS[new Date().getDay()];
var $=function(i){return document.getElementById(i)};
var mins=function(t){var p=t.split(":");return +p[0]*60+ +p[1]};
var fmt=function(t){var p=t.split(":"),h=+p[0];return (h%12||12)+":"+p[1]+(h<12?" am":" pm")};

function load(){
  fetch("schedule.json?t="+Date.now(),{cache:"no-store"})
    .then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(d){data=d;render();$("foot").textContent="Updates automatically every 30 seconds."})
    .catch(function(){$("foot").textContent="Couldn't load the schedule. Check your connection."});
}

function statusOf(c,isToday,now){
  var s=c.status||"auto";
  if(s==="cancelled"||s==="moved")return s;
  if(!isToday)return "soon";
  if(now>=mins(c.end))return "done";
  if(now>=mins(c.start))return "live";
  return "soon";
}
var LABEL={live:"Live now",soon:"Upcoming",done:"Finished",cancelled:"Cancelled",moved:"Moved"};

function render(){
  var d=new Date(), now=d.getHours()*60+d.getMinutes();
  $("title").textContent=data.className||"Class Schedule";
  $("clock").textContent=d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})+", "+d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  $("notice").textContent=data.notice||"";
  var tabs=$("days");tabs.innerHTML="";
  Object.keys(data.days).forEach(function(n){
    var b=document.createElement("button");b.textContent=n.slice(0,3);
    b.setAttribute("aria-pressed",n===picked);
    b.onclick=function(){picked=n;render()};
    tabs.appendChild(b);
  });
  var isToday=picked===DAYS[d.getDay()];
  var items=(data.days[picked]||[]).slice().sort(function(a,b){return mins(a.start)-mins(b.start)});
  var html="";
  items.forEach(function(c,i){
    var st=statusOf(c,isToday,now),pct=0;
    if(st==="live")pct=Math.round((now-mins(c.start))/(mins(c.end)-mins(c.start))*100);
    if(st==="done")pct=100;
    html+='<div class="card '+st+'"><div class="tile"><div class="fill" style="height:'+pct+'%"></div><span class="n">'+(i+1)+'</span><span class="s">'+esc(c.code)+'</span></div>'+
    '<div class="info"><h2>'+esc(c.subject)+'</h2><div class="meta">'+esc(c.room)+(c.teacher?" · "+esc(c.teacher):"")+'</div>'+
    '<div class="time">'+fmt(c.start)+" – "+fmt(c.end)+'</div><span class="badge b-'+st+'">'+LABEL[st]+(c.note?": "+esc(c.note):"")+'</span></div></div>';
  });
  $("list").innerHTML=html||'<div class="empty">No classes on '+picked+'.</div>';
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

load();
setInterval(load,30000);
setInterval(function(){if(data)render()},30000);
</script>
</body>
</html>
